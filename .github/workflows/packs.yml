name: Packs

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['packs/**', 'compile.py', '.github/workflows/packs.yml']

permissions:
  contents: write

concurrency:
  group: packs
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Залити модпаки
        env:
          GH_TOKEN: ${{ github.token }}
        run: python compile.py --packs
<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Авторизація</title>
    <link rel="stylesheet" href="/static/styles.css">
</head>
<body style="display: flex; align-items: center; justify-content: center; min-height: 100vh;">
    <div class="horns" style="max-width: 500px; width: 90%; background: linear-gradient(135deg, #fdfbdf, #f4e4ba); border-radius: 20px; padding: 40px; box-shadow: 0 15px 40px rgba(0,0,0,0.3); text-align: center; border: 3px solid #8b4513;">
        
        <div style="font-size: 80px; margin-bottom: 20px; color: {{ '#4caf50' if success else '#f44336' }};">
            {{ '✅' if success else '❌' }}
        </div>
        
        <h1 style="color: #4b2e2a; margin: 0 0 15px 0; font-size: 1.8em;">{{ title }}</h1>
        
        <div style="height: 3px; background: linear-gradient(90deg, transparent, #8b4513, transparent); margin: 25px 0; border-radius: 2px;"></div>
        
		<p style="color: #666; font-size: 1.1em; margin-bottom: 30px; line-height: 1.6;">{{ message }}</p>
        
        {% if success %}

        <button class="start-btn" onclick="window.close()" style="margin-top: 20px;">Закрити вікно</button>
        
        <p style="font-size: 0.85em; color: #999; margin-top: 15px;">Вікно автоматично закриється через <span id="countdown">5</span> секунд</p>
        {% else %}
        <div style="padding: 15px; background: rgba(139, 69, 19, 0.1); border-radius: 12px; border-left: 4px solid #8b4513; color: #4b2e2a; font-size: 0.95em; margin-top: 25px;">
            Спробуйте авторизуватися знову або зверніться до адміністрації сервера
        </div>
        
        <button class="start-btn" onclick="window.close()" style="margin-top: 20px;">Закрити вікно</button>
        {% endif %}
    </div>

    <script>
        {% if success %}
        let countdown = 5;
        const countdownEl = document.getElementById('countdown');
        
        const timer = setInterval(() => {
            countdown--;
            if (countdownEl) {
                countdownEl.textContent = countdown;
            }
            
            if (countdown <= 0) {
                clearInterval(timer);
                window.close();
            }
        }, 1000);
        {% endif %}
    </script>
</body>
</html>
